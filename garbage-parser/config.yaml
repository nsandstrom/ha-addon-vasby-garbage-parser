name: Waste Schedule PDF
version: "0.3.0"
slug: waste_schedule
description: Turn the waste collection PDF into Waste Collection Schedule YAML for Home Assistant
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: mdi:trash-can-outline
panel_title: Waste schedule
options:
  garden_waste: false
schema:
  garden_waste: bool
# Deliberately absent: map, ports, homeassistant_api, hassio_api, auth_api.
# The add-on has no access to /config, no token, and publishes no port.
